plugins { id 'com.android.application' }
// Release signing comes from keystore.properties next to settings.gradle. It is ignored by git; without it the release APK is left unsigned.
def signingFile = rootProject.file('keystore.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'in.prardhana.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'in.prardhana.app'; minSdk 26; targetSdk 35; versionCode 12; versionName '0.8.1' }
    defaultConfig { testInstrumentationRunner providers.gradleProperty('pilotRunner').getOrElse('in.prardhana.app.PilotInstrumentation') }
    signingConfigs {
        if (signingFile.exists()) {
            release { storeFile file(signing['storeFile']); storePassword signing['storePassword']; keyAlias signing['keyAlias']; keyPassword signing['keyPassword'] }
        }
    }
    buildTypes {
        // Testers get this build: not debuggable (no adb run-as access to the ledger) and signed with the project key, not a laptop debug key.
        release { debuggable false; minifyEnabled false; if (signingFile.exists()) signingConfig signingConfigs.release }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true; unitTests.all { systemProperty 'pilot.testArtifacts', rootProject.file('artifacts/v06-tests').absolutePath } }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Publish metadata only alongside a successfully assembled APK; the pilot service reads it from the release folder.
['debug', 'release'].each { variant ->
    def manifest = tasks.register("writePilotManifest${variant.capitalize()}") {
        doLast {
            def source = file('src/main/java/in/prardhana/app/TransactionParser.java').getText('UTF-8')
            def parser = (source =~ /VERSION\s*=\s*(\d+)/)[0][1].toInteger()
            def destination = layout.buildDirectory.file("outputs/apk/$variant/release.json").get().asFile
            def record = [versionCode:android.defaultConfig.versionCode, versionName:android.defaultConfig.versionName, parserVersion:parser]
            destination.delete()
            if (variant == 'release') {
                // The pilot service offers an APK only when this record matches its bytes, so write it only after verification.
                def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
                if (!apk.exists()) throw new GradleException('No signed release APK. Create keystore.properties (see README); unsigned builds are never published.')
                def tools = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}")
                def apksigner = new File(tools, org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'apksigner.bat' : 'apksigner')
                def out = new ByteArrayOutputStream()
                def result = project.exec { commandLine apksigner.absolutePath, 'verify', '--print-certs', apk.absolutePath; standardOutput = out; errorOutput = out; ignoreExitValue = true }
                def signer = (out.toString() =~ /Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})/)
                if (result.exitValue != 0 || !signer.find()) throw new GradleException("Release APK failed signature verification:\n$out")
                record.apkSha256 = apk.bytes.digest('SHA-256')
                record.signerSha256 = signer.group(1)
                record.debuggable = android.buildTypes.release.debuggable
            }
            destination.text = groovy.json.JsonOutput.toJson(record)
        }
    }
    tasks.matching { it.name == "assemble${variant.capitalize()}" }.configureEach { finalizedBy manifest }
}
